<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>伟大航路闯关</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="heroScreen" class="screen screen-active">
        <div class="masthead">
          <p class="kicker">Grand Line Challenge</p>
          <h1>伟大航路闯关</h1>
          <p class="intro">选择伙伴，突破五段经典航海试炼，用三种技能打穿每一关。</p>
        </div>

        <div class="character-grid" id="characterGrid" aria-label="角色选择"></div>
      </section>

      <section id="gameScreen" class="screen" aria-live="polite">
        <header class="stage-header">
          <button class="ghost-button" id="backToSelect" type="button">重新选人</button>
          <div>
            <p id="stageNumber" class="kicker">Stage 1</p>
            <h2 id="stageName">东海出航</h2>
            <p id="stageStory" class="stage-story"></p>
          </div>
          <div class="round-counter">回合 <span id="roundCount">1</span></div>
        </header>

        <section class="scene-stage east" id="sceneStage" aria-label="战斗场景">
          <div class="scene-sky">
            <div class="scene-sun"></div>
            <div class="cloud cloud-one"></div>
            <div class="cloud cloud-two"></div>
          </div>
          <div class="scene-landmark" id="sceneLandmark"></div>
          <div class="scene-sea">
            <div class="wave wave-one"></div>
            <div class="wave wave-two"></div>
            <div class="ship-shadow"></div>
          </div>
          <div class="scene-deck"></div>
          <div class="sprite-slot player-slot" id="playerSprite"></div>
          <div class="sprite-slot enemy-slot" id="enemySprite"></div>
          <div class="effect-layer" id="effectLayer"></div>
          <div class="scene-caption" id="sceneCaption">东海出航</div>
        </section>

        <div class="battlefield">
          <article class="fighter player-panel" id="playerPanel">
            <div class="fighter-art" id="playerAvatar"></div>
            <div class="fighter-info">
              <p class="role-label">伙伴</p>
              <h3 id="playerName"></h3>
              <div class="hp-row">
                <span>生命</span>
                <strong id="playerHpText">120/120</strong>
              </div>
              <div class="bar"><span id="playerHpBar"></span></div>
              <div class="status-line" id="playerStatus">准备出航</div>
            </div>
          </article>

          <div class="versus">VS</div>

          <article class="fighter enemy-panel" id="enemyPanel">
            <div class="fighter-art enemy-art" id="enemyAvatar"></div>
            <div class="fighter-info">
              <p class="role-label">敌方</p>
              <h3 id="enemyName"></h3>
              <div class="hp-row">
                <span>生命</span>
                <strong id="enemyHpText">90/90</strong>
              </div>
              <div class="bar enemy-bar"><span id="enemyHpBar"></span></div>
              <div class="status-line" id="enemyStatus">拦路者登场</div>
            </div>
          </article>
        </div>

        <section class="skills-wrap">
          <div class="skills-heading">
            <h3>技能</h3>
            <p id="turnHint">选择一个技能行动</p>
          </div>
          <div class="skill-grid" id="skillGrid"></div>
        </section>

        <section class="log-panel">
          <h3>航海记录</h3>
          <ol id="battleLog"></ol>
        </section>
      </section>

      <section id="resultScreen" class="screen result-screen">
        <p class="kicker" id="resultKicker">Clear</p>
        <h2 id="resultTitle">航线突破</h2>
        <p id="resultCopy"></p>
        <div class="result-stats" id="resultStats"></div>
        <div class="result-actions">
          <button class="primary-button" id="nextStage" type="button">进入下一关</button>
          <button class="ghost-button" id="retryStage" type="button">重试本关</button>
          <button class="ghost-button" id="resultSelect" type="button">重新选人</button>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
